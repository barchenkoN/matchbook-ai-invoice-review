[project]
name = "matchbook-invoice-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "sqlalchemy", "psycopg[binary]", "python-multipart", "pdfplumber", "pypdfium2", "reportlab", "rapidocr_onnxruntime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
